name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.6"

      # Static Analysis — installed directly rather than via
      # golangci-lint-action@v6, which failed against golangci-lint v2
      # (the action's version support lagged the v2 rewrite at the time of
      # writing). Same tool, same version, verified locally first.
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
      - run: golangci-lint run ./...

      # Unit + Integration Test (internal/cli/integration_test.go runs the
      # full CLI command tree against a real SQLite DB and service-due file)
      - run: go test ./...

      # Build
      - run: go build -o kitbook ./cmd/kitbook

      # Dependency Scan
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
