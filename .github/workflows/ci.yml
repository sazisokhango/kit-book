name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.6"

      # Static Analysis
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v2.13.2

      # Unit + Integration Test (internal/cli/integration_test.go runs the
      # full CLI command tree against a real SQLite DB and service-due file)
      - run: go test ./...

      # Build
      - run: go build -o kitbook ./cmd/kitbook

      # Dependency Scan
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
